        @keyframes spinRing {

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyr5LI9BBWz2CeGaBwsEQ96-3LizS03e_Yc-WJ9Z7hkHx_hn5aqW6RS82CXlnsYyRXF/exec';
        const AD_LINK = 'https://ink-fortune-ai.lovable.app/';
        const STORAGE_KEY = 'veganSurveyData';
        const LANG_KEY = 'veganSurveyLang';

        // ===== 粒子背景 =====
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let w, h;
            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);
            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * 0.4;
                    this.vy = (Math.random() - 0.5) * 0.4;
                    this.size = Math.random() * 3 + 1;
                    this.alpha = Math.random() * 0.3 + 0.1;
                    this.life = Math.random() * 100 + 100;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life--;
                    if (this.life <= 0 || this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
                    ctx.fill();
                }
            }
            for (let i = 0; i < 50; i++) particles.push(new Particle());
            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => { p.update(); p.draw(); });
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(255,255,255,${0.08*(1-dist/120)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // ===== Confetti =====
        const confettiCanvas = document.getElementById('confettiCanvas');
        const confettiCtx = confettiCanvas.getContext('2d');
        let confettiPieces = [];
        let confettiActive = false;
        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeConfetti();
        window.addEventListener('resize', resizeConfetti);
        function fireConfetti() {
            confettiPieces = [];
            const colors = ['#43a047','#66bb6a','#ff9800','#f5576c','#f093fb','#4fc3f7','#ffd54f'];
            for (let i = 0; i < 150; i++) {
                confettiPieces.push({
                    x: window.innerWidth/2, y: window.innerHeight/2,
                    vx: (Math.random()-0.5)*20, vy: (Math.random()-1)*20-5,
                    size: Math.random()*8+4, color: colors[Math.floor(Math.random()*colors.length)],
                    rotation: Math.random()*360, rotationSpeed: (Math.random()-0.5)*10,
                    gravity: 0.3+Math.random()*0.3, drag: 0.96
                });
            }
            confettiActive = true;
            animateConfetti();
        }
        function animateConfetti() {
            if (!confettiActive) return;
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let alive = false;
            confettiPieces.forEach(p => {
                p.x += p.vx; p.y += p.vy;
                p.vy += p.gravity; p.vx *= p.drag; p.vy *= p.drag;
                p.rotation += p.rotationSpeed;
                if (p.y < confettiCanvas.height+20) alive = true;
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation*Math.PI/180);
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
                confettiCtx.restore();
            });
            if (alive) requestAnimationFrame(animateConfetti);
            else { confettiActive = false; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
        }

        // ===== 打字機效果 =====
        const typewriterTexts = {
            'zh-TW': '感謝您的填寫，您的意見對素食世界的貢獻非常重要',
            'zh-CN': '感谢您的填写，您的意见对素食世界的贡献非常重要',
            'en': 'Thank you for your participation. Your feedback matters to the vegan community.'
        };
        let typewriterIndex = 0;
        let currentTypeText = typewriterTexts['zh-TW'];
        let typewriterTimeout;
        function typeWriter(text) {
            currentTypeText = text;
            typewriterIndex = 0;
            const el = document.getElementById('typewriter');
            el.textContent = '';
            clearTimeout(typewriterTimeout);
            function type() {
                if (typewriterIndex < text.length) {
                    el.textContent += text.charAt(typewriterIndex);
                    typewriterIndex++;
                    typewriterTimeout = setTimeout(type, 40);
                }
            }
            type();
        }

        // ===== 星星評分 =====
        let currentRating = 0;
        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('ratingInput');
        const ratingText = document.getElementById('ratingText');
        const ratingLabels = {
            'zh-TW': ['','⭐ 非常不滿意','⭐⭐ 不滿意','⭐⭐⭐ 普通','⭐⭐⭐⭐ 滿意','⭐⭐⭐⭐⭐ 非常滿意'],
            'zh-CN': ['','⭐ 非常不满意','⭐⭐ 不满意','⭐⭐⭐ 一般','⭐⭐⭐⭐ 满意','⭐⭐⭐⭐⭐ 非常满意'],
            'en': ['','⭐ Very Dissatisfied','⭐⭐ Dissatisfied','⭐⭐⭐ Neutral','⭐⭐⭐⭐ Satisfied','⭐⭐⭐⭐⭐ Very Satisfied']
        };
        function getRatingLabel(val) { return ratingLabels[currentLang][val] || ''; }
        stars.forEach(star => {
            star.addEventListener('click', function() {
                currentRating = parseInt(this.dataset.value);
                ratingInput.value = currentRating;
                ratingText.textContent = getRatingLabel(currentRating);
                ratingText.style.color = '#43a047';
                updateStars();
                updateProgress();
                triggerAutosave();
            });
            star.addEventListener('mouseenter', function() {
                const hoverValue = parseInt(this.dataset.value);
                stars.forEach((s, i) => {
                    s.style.filter = i < hoverValue ? 'grayscale(0)' : 'grayscale(1)';
                    s.style.opacity = i < hoverValue ? '1' : '0.3';
                });
            });
        });
        document.getElementById('starRating').addEventListener('mouseleave', updateStars);
        function updateStars() {
            stars.forEach((star, i) => {
                if (i < currentRating) {
                    star.style.filter = 'grayscale(0)'; star.style.opacity = '1'; star.classList.add('active');
                } else {
                    star.style.filter = 'grayscale(1)'; star.style.opacity = '0.3'; star.classList.remove('active');
                }
            });
        }

        // ===== 單選 / 多選 =====
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
                this.closest('.radio-option').classList.add('selected');
                updateProgress(); triggerAutosave();
            });
        });
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                this.closest('.checkbox-option').classList.toggle('selected', this.checked);
                updateProgress(); triggerAutosave();
            });
        });

        // ===== 進度條 =====
        function updateProgress() {
            const questions = document.querySelectorAll('.question');
            let filled = 0;
            questions.forEach(q => {
                const inputs = q.querySelectorAll('input, select, textarea');
                let hasValue = false;
                inputs.forEach(inp => {
                    if (inp.type === 'radio' || inp.type === 'checkbox') { if (inp.checked) hasValue = true; }
                    else if (inp.value.trim()) hasValue = true;
                });
                if (q.querySelector('#starRating') && currentRating > 0) hasValue = true;
                if (hasValue) filled++;
            });
            const percent = Math.round((filled / questions.length) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
        }
        document.querySelectorAll('input[data-track], select[data-track], textarea[data-track]').forEach(el => {
            el.addEventListener('input', () => { updateProgress(); triggerAutosave(); });
            el.addEventListener('change', () => { updateProgress(); triggerAutosave(); });
        });

        // ===== 自動保存 =====
        let autosaveTimer;
        function triggerAutosave() {
            const indicator = document.getElementById('autosaveIndicator');
            indicator.classList.add('visible');
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => {
                saveFormData();
                setTimeout(() => indicator.classList.remove('visible'), 1500);
            }, 800);
        }
        function saveFormData() {
            const data = {};
            const form = document.getElementById('surveyForm');
            const formData = new FormData(form);
            formData.forEach((val, key) => {
                if (data[key]) {
                    if (Array.isArray(data[key])) data[key].push(val);
                    else data[key] = [data[key], val];
                } else data[key] = val;
            });
            data.rating = currentRating;
            data.lang = currentLang;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        function loadFormData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (!saved) return;
                const data = JSON.parse(saved);
                if (data.lang) switchLang(data.lang);
                const form = document.getElementById('surveyForm');
                Object.keys(data).forEach(key => {
                    if (key === 'rating') {
                        currentRating = parseInt(data[key]) || 0;
                        if (currentRating > 0) {
                            ratingInput.value = currentRating;
                            ratingText.textContent = getRatingLabel(currentRating);
                            ratingText.style.color = '#43a047';
                            updateStars();
                        }
                    } else if (key !== 'lang') {
                        const els = form.querySelectorAll(`[name="${key}"]`);
                        if (els.length > 1) {
                            const vals = Array.isArray(data[key]) ? data[key] : [data[key]];
                            els.forEach(el => {
                                if (vals.includes(el.value)) {
                                    el.checked = true;
                                    el.closest('.checkbox-option')?.classList.add('selected');
                                }
                            });
                        } else if (els.length === 1) {
                            const el = els[0];
                            if (el.type === 'radio') {
                                if (el.value === data[key]) {
                                    el.checked = true;
                                    el.closest('.radio-option')?.classList.add('selected');
                                }
                            } else el.value = data[key];
                        }
                    }
                });
                updateProgress();
            } catch (e) { console.log('Load form error:', e); }
        }

        // ===== 表單提交 =====
        document.getElementById('surveyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            let hasError = false;
            document.querySelectorAll('.question[data-required="true"]').forEach(q => {
                const inputs = q.querySelectorAll('input, select');
                let valid = false;
                inputs.forEach(inp => {
                    if (inp.type === 'radio') { if (inp.checked) valid = true; }
                    else if (inp.value.trim()) valid = true;
                });
                if (!valid) {
                    hasError = true;
                    inputs.forEach(inp => inp.classList.add('error'));
                    setTimeout(() => inputs.forEach(inp => inp.classList.remove('error')), 600);
                }
            });
            if (hasError) return;
            const submitBtn = document.getElementById('submitBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const formData = new FormData(this);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                age: formData.get('age') || '未填寫',
                satisfaction: formData.get('satisfaction'),
                interests: Array.from(document.querySelectorAll('input[name="interests"]:checked')).map(cb => cb.value).join(', ') || '未選擇',
                rating: formData.get('rating'),
                feedback: formData.get('feedback') || '未填寫',
                timestamp: new Date().toLocaleString('zh-TW')
            };
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            loadingOverlay.classList.add('active');
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                loadingOverlay.classList.remove('active');
                document.getElementById('surveyForm').style.display = 'none';
                document.getElementById('adsenseSection').style.display = 'none';
                document.querySelector('.progress-container').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('adSection1').style.display = 'block';
                localStorage.removeItem(STORAGE_KEY);
                fireConfetti();
            } catch (error) {
                console.error('提交失敗:', error);
                loadingOverlay.classList.remove('active');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                alert(translations[currentLang].submitError || '提交失敗，請稍後再試。');
            }
        });

        // ===== 瀏覽計數 =====
        function updateViewCount() {
            try {
                let count = parseInt(localStorage.getItem('surveyViewCount') || '128');
                const lastVisit = localStorage.getItem('surveyLastVisit');
                const now = Date.now();
                const oneHour = 3600000;
                if (!lastVisit || (now - parseInt(lastVisit)) > oneHour) {
                    count++;
                    localStorage.setItem('surveyViewCount', count.toString());
                    localStorage.setItem('surveyLastVisit', now.toString());
                }
                const el = document.getElementById('viewCount');
                if (el) {
                    animateNumber(el, 0, count, 1000);
                }
            } catch (e) {
                console.log('View count error:', e);
            }
        }
        function animateNumber(el, start, end, duration) {
            const startTime = performance.now();
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(start + (end - start) * easeOut);
                el.textContent = current.toLocaleString('zh-TW') + (translations[currentLang].viewCountSuffix || ' 次瀏覽');
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        // ===== 滾動顯現動畫 =====
        function initScrollReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const delay = entry.target.dataset.delay || 0;
                        setTimeout(() => entry.target.classList.add('visible'), parseInt(delay));
                    }
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.info-card, .form-card, .question').forEach(el => observer.observe(el));
        }
