        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);

        .container {

        /* Header */
        .header {

            padding: 40px 20px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 12px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);

        .form-card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            margin-bottom: 24px;

        .form-card h2 {
            color: #333;
            margin-bottom: 24px;
            font-size: 1.4rem;

        /* Question Block */
        .question {
            margin-bottom: 28px;
        }

        .question label {
            display: block;
            color: #444;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.05rem;

        .required {
            color: #e74c3c;
        }

        /* Text Input */
        .question input[type="text"],
        .question input[type="email"],
        .question select,
        .question textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s;
            background: white;
        }

        .question input[type="text"]:focus,
        .question input[type="email"]:focus,
        .question select:focus,
        .question textarea:focus {
            outline: none;
            border-color: #43a047;
            box-shadow: 0 0 0 3px rgba(67,160,71,0.1);
        }

        .question textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Radio Buttons */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        .radio-option:hover {
            border-color: #43a047;
            background: rgba(102,126,234,0.05);
        }

        .radio-option input {
            display: none;
        }

        .radio-option.selected {
            border-color: #43a047;
            background: rgba(102,126,234,0.1);
        }

        .radio-option input:checked + span {
            color: #43a047;
            font-weight: 600;
        }

        /* Checkboxes */
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-option:hover {
            border-color: #43a047;
        }

        .checkbox-option input {
            display: none;
        }

        .checkbox-option.selected {
            border-color: #43a047;
            background: rgba(102,126,234,0.1);
        }

        .checkbox-option .check-icon {
            width: 18px;
            height: 18px;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .checkbox-option.selected .check-icon {
            background: #43a047;
            border-color: #43a047;
        }

        .checkbox-option.selected .check-icon::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        /* Star Rating */
        .star-rating {
            display: flex;
            gap: 8px;
            font-size: 2.2rem;
            cursor: pointer;
        }

        .star {
            transition: transform 0.2s;
            user-select: none;

        .star:hover {
            transform: scale(1.2);
        }

        .star.active {

    <!-- Language Switcher Styles -->

        .lang-switcher {

        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('ratingInput');
        const ratingText = document.getElementById('ratingText');
        const ratingLabels = ['', '⭐ 非常不滿意', '⭐⭐ 不滿意', '⭐⭐⭐ 普通', '⭐⭐⭐⭐ 滿意', '⭐⭐⭐⭐⭐ 非常滿意'];

        stars.forEach(star => {
            star.addEventListener('click', function() {
                currentRating = parseInt(this.dataset.value);
                ratingInput.value = currentRating;
                ratingText.textContent = ratingLabels[currentRating];
                ratingText.style.color = '#43a047';
                updateStars();
            });

            star.addEventListener('mouseenter', function() {
                const hoverValue = parseInt(this.dataset.value);
                stars.forEach((s, i) => {
                    if (i < hoverValue) {
                        s.textContent = '⭐';
                        s.classList.add('active');
                    } else {
                        s.textContent = '☆';
                        s.classList.remove('active');
                    }
                });
            });
        });

        document.getElementById('starRating').addEventListener('mouseleave', updateStars);

        function updateStars() {
            stars.forEach((star, i) => {
                if (i < currentRating) {
                    star.textContent = '⭐';
                    star.classList.add('active');
                } else {
                    star.textContent = '☆';
                    star.classList.remove('active');
                }
            });
        }

        // ============================================
        // 單選按鈕樣式
        // ============================================
        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
                this.closest('.radio-option').classList.add('selected');
            });
        });

        // ============================================
        // 多選框樣式
        // ============================================
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                this.closest('.checkbox-option').classList.toggle('selected', this.checked);
            });
        });

        // ============================================
        // 表單提交
        // ============================================
        document.getElementById('surveyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');

            // 收集表單資料
            const formData = new FormData(this);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                age: formData.get('age') || '未填寫',
                satisfaction: formData.get('satisfaction'),
                interests: Array.from(document.querySelectorAll('input[name="interests"]:checked')).map(cb => cb.value).join(', ') || '未選擇',
                rating: formData.get('rating'),
                feedback: formData.get('feedback') || '未填寫',
                timestamp: new Date().toLocaleString('zh-TW')
            };

            // 顯示載入中
            loadingOverlay.classList.add('active');
            submitBtn.disabled = true;

            try {
                // 發送資料到 Google 試算表
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                // 成功處理
                loadingOverlay.classList.remove('active');
                document.getElementById('surveyForm').style.display = 'none';
                document.querySelector('.adsense-section').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';

                // ====== 顯示手動廣告區塊 ======
                document.getElementById('adSection1').style.display = 'block';

            } catch (error) {
                console.error('提交失敗:', error);
                loadingOverlay.classList.remove('active');
                submitBtn.disabled = false;
                alert('提交失敗，請稍後再試。');
            }
        });

        // ============================================
        // 重置表單
        // ============================================
        function resetForm() {
            document.getElementById('surveyForm').reset();
            document.getElementById('surveyForm').style.display = 'block';
            document.querySelector('.adsense-section').style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;

            // 隱藏手動廣告
            document.getElementById('adSection1').style.display = 'none';

            // 重置星星
            currentRating = 0;
            ratingInput.value = '0';
            ratingText.textContent = '請點擊星星評分';
            ratingText.style.color = '#888';
            updateStars();

            // 重置樣式
            document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
            document.querySelectorAll('.checkbox-option').forEach(opt => opt.classList.remove('selected'));
        }
    
        // ============================================
        // 瀏覽計數功能（使用 localStorage）
        // ============================================
        function updateViewCount() {
            try {
                // 使用 localStorage 計數
                let localCount = parseInt(localStorage.getItem('surveyViewCount') || '0');
                localCount++;
                localStorage.setItem('surveyViewCount', localCount.toString());
                var viewCountEl = document.getElementById('viewCount');
                if (viewCountEl) {
                    viewCountEl.textContent = localCount.toLocaleString('zh-TW') + ' 次瀏覽';
                }
            } catch (e) {
                console.log('View count error:', e);
                var viewCountEl = document.getElementById('viewCount');
                if (viewCountEl) {
                    viewCountEl.textContent = '統計中...';
                }
            }
        }

        // 頁面載入時更新計數（延遲執行確保 DOM 已載入）
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateViewCount);
        } else {
            updateViewCount();
        }

        let currentLang = 'zh-TW';

        function switchLang(lang) {
            currentLang = lang;
            const t = translations[lang];

            // Update button active state
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // Update header
            document.querySelector('.header h1').textContent = t.title;
            document.querySelector('.header p').textContent = t.subtitle;

            // Update questions
            const questions = document.querySelectorAll('.question');
            questions[0].querySelector('label').innerHTML = t.q1 + ' <span class="required">*</span>';
            questions[0].querySelector('input').placeholder = t.q1Placeholder;

            questions[1].querySelector('label').innerHTML = t.q2 + ' <span class="required">*</span>';
            questions[1].querySelector('input').placeholder = t.q2Placeholder;
